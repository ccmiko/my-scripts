<!DOCTYPE html>
<html lang="jp">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>アカウント一覧</title>
  </head>
  <body>
    <div>
      <table>
        <caption>
          アカウント一覧
        </caption>
        <thead>
          <tr>
            <th>概要</th>
            <th>ID</th>
            <th>PW</th>
            <th>リンク</th>
            <th>備考</th>
          </tr>
        </thead>
        <tbody id="tBody">
          <!-- jsでデータを挿入する -->
        </tbody>
      </table>
    </div>
  </body>
</html>

<script type="module">
  const showCopiedMessage = () => {
    const elem = document.createElement("div");
    elem.style.cssText =
      "position: fixed; top: 0; margin: 10px auto; width: 80%; max-width: 1200px; z-index: 999; background-color: #E7F1ED";
    elem.textContent = "コピーしました！";
    document.body.appendChild(elem);
    setTimeout(() => elem.remove(), 500);
  };

  const createCopyButton = (value) => {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = "コピー";
    button.addEventListener("click", () => {
      navigator.clipboard.writeText(value);
      showCopiedMessage();
    });
    return button;
  };

  /** http(s)以外(javascript: 等)のURLは無効扱いにする */
  const toSafeUrl = (link) => {
    try {
      const url = new URL(link);
      return ["http:", "https:"].includes(url.protocol) ? url.href : null;
    } catch {
      return null;
    }
  };

  /** 改行(\n または <br>)だけを反映し、それ以外はテキストとして表示する */
  const appendMultilineText = (parent, text) => {
    String(text ?? "")
      .split(/<br\s*\/?>|\n/i)
      .forEach((line, index) => {
        if (index > 0) parent.appendChild(document.createElement("br"));
        parent.appendChild(document.createTextNode(line));
      });
  };

  const appendCopyCell = (row, value) => {
    const cell = row.insertCell(-1);
    if (value) {
      cell.appendChild(createCopyButton(value));
    } else {
      cell.textContent = "-";
    }
  };

  /**
  想定しているJSONの形式 (見本: account.sample.json)
  [
    {
      "service": "onlogin",
      "id": "meado",
      "pw": "test1",
      "link": "https://google.com",
      "note": "メモメモメモ<br>メモメモメモメモ"
    }
  ]
  */
  fetch("./account.json")
    .then((result) => {
      if (!result.ok) {
        throw new Error(`account.json を取得できません (${result.status})`);
      }
      return result.json();
    })
    .then((json) => {
      const table = document.getElementById("tBody");
      json.forEach((item) => {
        const row = table.insertRow(-1);

        const serviceCell = row.insertCell(-1);
        serviceCell.textContent = item.service ?? "";
        serviceCell.style.fontWeight = "bold";

        appendCopyCell(row, item.id);
        appendCopyCell(row, item.pw);

        const linkCell = row.insertCell(-1);
        const safeUrl = toSafeUrl(item.link);
        if (safeUrl) {
          const anchor = document.createElement("a");
          anchor.href = safeUrl;
          anchor.target = "_blank";
          anchor.rel = "noopener noreferrer";
          anchor.textContent = "開く";
          linkCell.appendChild(anchor);
          linkCell.appendChild(document.createElement("br"));
          linkCell.appendChild(createCopyButton(safeUrl));
        } else {
          linkCell.textContent = "-";
        }

        appendMultilineText(row.insertCell(-1), item.note);
      });
    })
    .catch((error) => {
      console.error(error);
      window.alert(`${error.message}\naccount.sample.json をコピーして account.json を作成してください`);
    });
</script>

<style>
  /*
   * コピペ元: https://webliker.info/css/75964/
   * ※細かい点を書き換えています。
   */
  div {
    width: 100%;
  }
  table {
    width: 80%;
    max-width: 1200px;
    margin: auto;
    border-collapse: separate;
    border-spacing: 0;
  }

  table caption {
    font-size: 20px;
    font-weight: bold;
    margin: 10px 0;
  }

  table th:first-child {
    border-radius: 5px 0 0 0;
  }

  table th:last-child {
    border-radius: 0 5px 0 0;
    border-right: 1px solid #3c6690;
  }

  table th {
    text-align: center;
    color: white;
    background: linear-gradient(#829ebc, #225588);
    border-left: 1px solid #3c6690;
    border-top: 1px solid #3c6690;
    border-bottom: 1px solid #3c6690;
    box-shadow: 0px 1px 1px rgba(255, 255, 255, 0.3) inset;

    padding: 10px 0;
  }

  table td {
    text-align: center;
    border-left: 1px solid #a8b7c5;
    border-bottom: 1px solid #a8b7c5;
    border-top: none;

    padding: 10px 0;
  }

  table td:last-child {
    border-right: 1px solid #a8b7c5;
  }

  table tr:last-child td:first-child {
    border-radius: 0 0 0 5px;
  }

  table tr:last-child td:last-child {
    border-radius: 0 0 5px 0;
  }

  table tbody tr:nth-child(n):hover {
    background-color: rgba(215, 216, 218, 0.491);
  }
  table tbody tr:nth-child(2n):hover {
    background-color: rgba(104, 110, 117, 0.491);
  }
  table tbody td:hover {
    background-color: rgb(145, 173, 205);
  }
</style>
