<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>遅延再生くん</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#2f9e44" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <!-- テーマ(ダークモード)をちらつかせず適用するため、head で同期的に読み込む -->
    <script src="./common.js"></script>
    <link rel="stylesheet" href="./app.css" />
    <style>
      :root {
        --input-color: #2b6cb0;
        --output-color: #dd6b20;
        --grid-color: #d0d4da;
        --text-color: #555;
        --canvas-bg: #fafbfc;
      }

      :root[data-theme="dark"] {
        --input-color: #63a4ff;
        --output-color: #f6a05a;
        --grid-color: #3a3f47;
        --text-color: #aaa;
        --canvas-bg: #1c1f24;
      }

      .wrapper {
        max-width: 900px;
      }

      .graph + .graph {
        margin-top: 16px;
      }

      #status {
        margin: 8px 0 0;
      }

      .graph h2 {
        font-size: 16px;
        margin: 0 0 4px;
      }

      .graph canvas {
        display: block;
        width: 100%;
        height: 140px;
        background: var(--canvas-bg);
        border: 1px solid var(--grid-color);
        border-radius: 4px;
      }

      .legend {
        font-size: 13px;
        margin: 4px 0 0;
      }

      .legend .swatch {
        display: inline-block;
        width: 12px;
        height: 3px;
        vertical-align: middle;
        margin: 0 4px 0 12px;
      }

      .legend .swatch:first-child {
        margin-left: 0;
      }
    </style>
  </head>

  <body>
    <div class="wrapper">
      <section>
        <div class="row">
          <button id="record-button" type="button" class="primary">開始</button>
          <button id="stop-button" type="button" disabled>停止</button>
        </div>
        <p id="status" class="muted" role="status">停止中</p>
        <label>
          遅延時間: <span id="delay-value">3.0</span>秒
          <input id="delay-input" type="range" min="0" max="10" step="0.1" value="3" />
        </label>
        <label>
          音量: <span id="volume-value">100</span>%
          <input id="volume-input" type="range" min="0" max="200" step="1" value="100" />
        </label>
      </section>
      <section>
        <div class="graph">
          <h2>音量レベルの推移(直近12秒)</h2>
          <canvas id="level-canvas"></canvas>
          <p class="legend">
            <span class="swatch" style="background: var(--input-color)"></span>入力(マイク)
            <span class="swatch" style="background: var(--output-color)"></span>出力(遅延後) —
            出力の山が入力から遅延時間ぶん右にずれて現れます
          </p>
        </div>
        <div class="graph">
          <h2>波形(リアルタイム)</h2>
          <canvas id="wave-canvas"></canvas>
          <p class="legend">
            <span class="swatch" style="background: var(--input-color)"></span>入力(マイク)
            <span class="swatch" style="background: var(--output-color)"></span>出力(遅延後)
          </p>
        </div>
      </section>
      <p class="usage">
        使い方: マイクの音を、指定した時間だけ遅らせてスピーカーから流します(発声・楽器練習の確認用)。
      </p>
    </div>
    <script type="module">
      const MAX_DELAY_SECONDS = 10;
      /** レベル推移グラフに表示する秒数(最大遅延より長くして、ずれが見えるようにする) */
      const HISTORY_SECONDS = 12;
      /** レベル表示の下限(dB)。これより小さい音は0として描く */
      const MIN_DB = -60;

      const elems = {
        record: document.getElementById("record-button"),
        stop: document.getElementById("stop-button"),
        status: document.getElementById("status"),
        delayInput: document.getElementById("delay-input"),
        delayValue: document.getElementById("delay-value"),
        volumeInput: document.getElementById("volume-input"),
        volumeValue: document.getElementById("volume-value"),
        levelCanvas: document.getElementById("level-canvas"),
        waveCanvas: document.getElementById("wave-canvas"),
      };

      /** 再生中のみ値が入る */
      const audio = {
        stream: null,
        ctx: null,
        delayNode: null,
        gainNode: null,
        inputAnalyser: null,
        outputAnalyser: null,
      };

      /** グラフ描画用の状態 */
      const graph = {
        animationId: null,
        /** { t: 秒(AudioContext の時刻), input: 0〜1, output: 0〜1 } の配列 */
        history: [],
        inputBuffer: null,
        outputBuffer: null,
      };

      const isPlaying = () => audio.ctx !== null;

      const updateButtons = () => {
        elems.record.disabled = isPlaying();
        elems.stop.disabled = !isPlaying();
        elems.status.textContent = isPlaying() ? "再生中" : "停止中";
      };

      // ---------- グラフ描画 ----------

      const cssVar = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

      /** 高解像度ディスプレイでぼやけないよう、表示サイズ × devicePixelRatio に合わせる */
      const fitCanvas = (canvas) => {
        const dpr = window.devicePixelRatio || 1;
        const width = Math.round(canvas.clientWidth * dpr);
        const height = Math.round(canvas.clientHeight * dpr);
        if (canvas.width !== width || canvas.height !== height) {
          canvas.width = width;
          canvas.height = height;
        }
        const ctx = canvas.getContext("2d");
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        return { ctx, width: canvas.clientWidth, height: canvas.clientHeight };
      };

      /** 波形データの RMS を 0〜1 のレベル(dB スケール)に変換する */
      const toLevel = (buffer) => {
        let sum = 0;
        for (let i = 0; i < buffer.length; i++) {
          sum += buffer[i] * buffer[i];
        }
        const rms = Math.sqrt(sum / buffer.length);
        if (rms <= 0) {
          return 0;
        }
        const db = 20 * Math.log10(rms);
        return Math.min(1, Math.max(0, (db - MIN_DB) / -MIN_DB));
      };

      const drawLevelGraph = (now) => {
        const { ctx, width, height } = fitCanvas(elems.levelCanvas);
        const padBottom = 18;
        const plotHeight = height - padBottom;
        ctx.clearRect(0, 0, width, height);

        // 1秒ごとの目盛り(右端が現在)
        ctx.strokeStyle = cssVar("--grid-color");
        ctx.fillStyle = cssVar("--text-color");
        ctx.font = "11px sans-serif";
        ctx.textAlign = "center";
        ctx.lineWidth = 1;
        for (let sec = 0; sec <= HISTORY_SECONDS; sec++) {
          const x = width - (sec / HISTORY_SECONDS) * width;
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, plotHeight);
          ctx.stroke();
          if (sec % 2 === 0) {
            ctx.fillText(sec === 0 ? "現在" : `-${sec}s`, Math.min(width - 14, Math.max(14, x)), height - 4);
          }
        }

        const drawLine = (key, color) => {
          ctx.strokeStyle = color;
          ctx.lineWidth = 2;
          ctx.beginPath();
          graph.history.forEach((point, index) => {
            const x = width - ((now - point.t) / HISTORY_SECONDS) * width;
            const y = plotHeight - point[key] * (plotHeight - 4);
            if (index === 0) {
              ctx.moveTo(x, y);
            } else {
              ctx.lineTo(x, y);
            }
          });
          ctx.stroke();
        };
        drawLine("input", cssVar("--input-color"));
        drawLine("output", cssVar("--output-color"));
      };

      const drawWaveGraph = () => {
        const { ctx, width, height } = fitCanvas(elems.waveCanvas);
        ctx.clearRect(0, 0, width, height);

        // 中心線
        ctx.strokeStyle = cssVar("--grid-color");
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, height / 2);
        ctx.lineTo(width, height / 2);
        ctx.stroke();

        const drawWave = (buffer, color) => {
          ctx.strokeStyle = color;
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          for (let i = 0; i < buffer.length; i++) {
            const x = (i / (buffer.length - 1)) * width;
            const value = Math.max(-1, Math.min(1, buffer[i]));
            const y = height / 2 - value * (height / 2 - 2);
            if (i === 0) {
              ctx.moveTo(x, y);
            } else {
              ctx.lineTo(x, y);
            }
          }
          ctx.stroke();
        };
        drawWave(graph.inputBuffer, cssVar("--input-color"));
        drawWave(graph.outputBuffer, cssVar("--output-color"));
      };

      const renderFrame = () => {
        if (!isPlaying()) {
          return;
        }
        audio.inputAnalyser.getFloatTimeDomainData(graph.inputBuffer);
        audio.outputAnalyser.getFloatTimeDomainData(graph.outputBuffer);

        const now = audio.ctx.currentTime;
        graph.history.push({
          t: now,
          input: toLevel(graph.inputBuffer),
          output: toLevel(graph.outputBuffer),
        });
        while (graph.history.length && now - graph.history[0].t > HISTORY_SECONDS) {
          graph.history.shift();
        }

        drawLevelGraph(now);
        drawWaveGraph();
        graph.animationId = requestAnimationFrame(renderFrame);
      };

      const startGraph = () => {
        graph.history = [];
        graph.inputBuffer = new Float32Array(audio.inputAnalyser.fftSize);
        graph.outputBuffer = new Float32Array(audio.outputAnalyser.fftSize);
        graph.animationId = requestAnimationFrame(renderFrame);
      };

      const stopGraph = () => {
        if (graph.animationId !== null) {
          cancelAnimationFrame(graph.animationId);
          graph.animationId = null;
        }
        // 停止後も最後のグラフは残しておく
      };

      // ---------- 音声処理 ----------

      const start = async () => {
        if (isPlaying()) {
          return;
        }
        elems.record.disabled = true;
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: false, audio: true });
          const ctx = new AudioContext();
          const source = ctx.createMediaStreamSource(stream);

          // マイク → 遅延 → 音量 → スピーカー の順に直列で接続する
          // (並列に繋ぐと元の経路の音がそのまま出てしまい、音量調整が効かない)
          const delayNode = ctx.createDelay(MAX_DELAY_SECONDS);
          delayNode.delayTime.value = Number(elems.delayInput.value);
          const gainNode = ctx.createGain();
          gainNode.gain.value = Number(elems.volumeInput.value) / 100;

          source.connect(delayNode);
          delayNode.connect(gainNode);
          gainNode.connect(ctx.destination);

          // グラフ用に、入力(マイク直後)と出力(音量調整後)を分岐して解析する。
          // AnalyserNode は音を加工しないので、再生される音には影響しない
          const inputAnalyser = ctx.createAnalyser();
          inputAnalyser.fftSize = 2048;
          source.connect(inputAnalyser);
          const outputAnalyser = ctx.createAnalyser();
          outputAnalyser.fftSize = 2048;
          gainNode.connect(outputAnalyser);

          Object.assign(audio, { stream, ctx, delayNode, gainNode, inputAnalyser, outputAnalyser });
          startGraph();
        } catch (error) {
          console.error(error);
          window.alert(`マイクを開始できませんでした: ${error.message}`);
        } finally {
          updateButtons();
        }
      };

      const stop = async () => {
        if (!isPlaying()) {
          return;
        }
        stopGraph();
        audio.stream.getTracks().forEach((track) => track.stop());
        // AudioContext を閉じないと開始のたびに増え続ける
        await audio.ctx.close();
        Object.assign(audio, {
          stream: null,
          ctx: null,
          delayNode: null,
          gainNode: null,
          inputAnalyser: null,
          outputAnalyser: null,
        });
        updateButtons();
      };

      elems.delayInput.addEventListener("input", () => {
        const value = Number(elems.delayInput.value);
        elems.delayValue.textContent = value.toFixed(1);
        if (audio.delayNode) {
          audio.delayNode.delayTime.setValueAtTime(value, audio.ctx.currentTime);
        }
      });

      elems.volumeInput.addEventListener("input", () => {
        const value = Number(elems.volumeInput.value);
        elems.volumeValue.textContent = String(value);
        if (audio.gainNode) {
          audio.gainNode.gain.setValueAtTime(value / 100, audio.ctx.currentTime);
        }
      });

      elems.record.addEventListener("click", start);
      elems.stop.addEventListener("click", stop);
    </script>
  </body>
</html>
