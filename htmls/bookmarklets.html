<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ブックマークレット</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#2f9e44" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <!-- テーマ(ダークモード)をちらつかせず適用するため、head で同期的に読み込む -->
    <script src="./common.js"></script>
    <link rel="stylesheet" href="./app.css" />
    <style>
      .howto ul {
        padding-left: 1.4em;
      }

      #list {
        display: grid;
        gap: 10px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      #list li {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 6px 12px;
        align-items: center;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
      }

      #list .description {
        grid-column: 1 / -1;
        margin: 0;
      }

      /* ブックマークバーへドラッグする部分 */
      .bookmarklet {
        justify-self: start;
        display: inline-block;
        padding: 6px 14px;
        border-radius: 999px;
        border: 2px dashed var(--accent);
        color: var(--fg);
        font-weight: bold;
        text-decoration: none;
        cursor: grab;
      }

      .bookmarklet:active {
        cursor: grabbing;
      }

      #list button {
        font-size: 13px;
        padding: 3px 10px;
      }
    </style>
  </head>

  <body>
    <div class="wrapper">
      <section>
        <ul id="list"></ul>
      </section>

      <div class="usage howto">
        <p><strong>登録のしかた</strong></p>
        <ul>
          <li>パソコン: 緑の点線のボタンを、ブラウザのブックマークバーへドラッグ＆ドロップする。</li>
          <li>
            スマホ: このページを一度ブックマークし、そのブックマークを編集して、URL
            を「URLをコピー」でコピーしたものに書き換える。
          </li>
        </ul>
        <p>
          使うときは、対象のページを開いた状態でブックマークを選びます。このページ上でボタンを押しても実行されません。
        </p>
      </div>
    </div>

    <!-- 一覧は scripts/build-bookmarklets.js が bookmarklet/*.js から生成する -->
    <script src="./bookmarklets.data.js"></script>
    <script type="module">
      const list = document.getElementById("list");
      (window.BOOKMARKLETS ?? []).forEach(({ title, description, href }) => {
        const li = document.createElement("li");

        const anchor = document.createElement("a");
        anchor.className = "bookmarklet";
        anchor.href = href;
        anchor.textContent = title;
        anchor.title = "ブックマークバーへドラッグして登録";
        // このページ上で誤って実行しないようにする(ドラッグでの登録はできる)
        anchor.addEventListener("click", (event) => {
          event.preventDefault();
          window.MiniApps.showSnackBar("ブックマークバーへドラッグして登録してください");
        });

        const copyButton = document.createElement("button");
        copyButton.type = "button";
        copyButton.textContent = "URLをコピー";
        copyButton.addEventListener("click", () =>
          window.MiniApps.copyText(href, `「${title}」の URL をコピーしました`),
        );

        const desc = document.createElement("p");
        desc.className = "description muted";
        desc.textContent = description;

        li.append(anchor, copyButton, desc);
        list.appendChild(li);
      });
    </script>
  </body>
</html>
