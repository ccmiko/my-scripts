<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>書式殺し</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#2f9e44" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <!-- テーマ(ダークモード)をちらつかせず適用するため、head で同期的に読み込む -->
    <script src="./common.js"></script>
    <link rel="stylesheet" href="./app.css" />
    <style>
      .wrapper {
        max-width: 960px;
        /* ページ下部のテーマ切り替えボタンの分だけ控える */
        min-height: calc(100dvh - 56px);
        padding-bottom: 12px;
        display: flex;
        flex-direction: column;
      }

      .editor {
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      #textarea {
        flex: 1;
        min-height: 8em;
        font-size: 18px;
      }

      #message {
        min-height: 1.5em;
        margin: 4px 0;
        color: var(--accent);
      }
    </style>
  </head>

  <body>
    <div class="wrapper">
      <section class="editor">
        <label>
          <input id="remove-tab" type="checkbox" checked />
          タブ文字も削除する(Excel等の表を貼り付ける場合は外してください)
        </label>
        <p id="message" role="status"></p>
        <textarea id="textarea" placeholder="ここに貼り付け(Ctrl/⌘+V)"></textarea>
      </section>
      <p class="usage">
        使い方:
        上の欄に貼り付けた瞬間、テキストに付いている書式を削除し、書式なしのテキストをクリップボードにも書き戻します。
      </p>
    </div>

    <script type="module">
      const textarea = document.getElementById("textarea");
      const removeTabElem = document.getElementById("remove-tab");
      const messageElem = document.getElementById("message");

      const cleanText = (text) => {
        const replaced = removeTabElem.checked ? text.replace(/\t/g, "") : text;
        return replaced.trim();
      };

      textarea.addEventListener("paste", async (e) => {
        // ブラウザ標準の貼り付けを止め、加工後のテキストを挿入する
        e.preventDefault();
        const text = cleanText(e.clipboardData.getData("text/plain"));
        textarea.setRangeText(text, textarea.selectionStart, textarea.selectionEnd, "end");
        try {
          await navigator.clipboard.writeText(text);
          messageElem.textContent = "書式なしのテキストをクリップボードに書き戻しました";
        } catch (error) {
          console.error(error);
          messageElem.textContent = "クリップボードへの書き戻しに失敗しました";
        }
      });
    </script>
  </body>
</html>
