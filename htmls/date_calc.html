<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>和暦・日付計算</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#2f9e44" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <!-- テーマ(ダークモード)をちらつかせず適用するため、head で同期的に読み込む -->
  <script src="./common.js"></script>
  <link rel="stylesheet" href="./app.css" />
  <style>
    .result {
      font-size: 18px;
      font-weight: bold;
      margin: 8px 0 0;
      white-space: pre-line;
    }

    .result .muted {
      font-weight: normal;
    }

    input[type="number"] {
      width: 7em;
    }

    #era-table td,
    #era-table th {
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="wrapper">
    <h1>和暦・日付計算</h1>

    <section>
      <h2>西暦 → 和暦</h2>
      <div class="row">
        <input id="to-wareki-date" type="date" />
        <button type="button" data-today="to-wareki-date">今日</button>
      </div>
      <p id="to-wareki-result" class="result"></p>
    </section>

    <section>
      <h2>和暦 → 西暦</h2>
      <div class="row">
        <select id="era"></select>
        <input id="era-year" type="number" min="1" step="1" value="1" aria-label="和暦の年" /> 年
      </div>
      <p id="to-seireki-result" class="result"></p>
    </section>

    <section>
      <h2>○日後・○日前</h2>
      <div class="row">
        <input id="add-base" type="date" />
        <button type="button" data-today="add-base">今日</button>
        から
        <input id="add-days" type="number" step="1" value="30" aria-label="日数" />
        <select id="add-unit">
          <option value="day" selected>日</option>
          <option value="week">週間</option>
          <option value="month">か月</option>
          <option value="year">年</option>
        </select>
        後
      </div>
      <label><input id="add-skip-weekend" type="checkbox" /> 土日を数えない(単位が「日」のときのみ。祝日は考慮しません)</label>
      <p class="muted">前の日付を知りたいときはマイナスの数を入れてください。</p>
      <p id="add-result" class="result"></p>
    </section>

    <section>
      <h2>2つの日付の差</h2>
      <div class="row">
        <input id="diff-from" type="date" aria-label="開始日" />
        〜
        <input id="diff-to" type="date" aria-label="終了日" />
        <button type="button" data-today="diff-to">今日</button>
      </div>
      <label><input id="diff-inclusive" type="checkbox" /> 開始日も1日目として数える(当日を含む)</label>
      <p id="diff-result" class="result"></p>
    </section>

    <section>
      <h2>年齢</h2>
      <div class="row">
        生年月日 <input id="birth" type="date" />
        時点 <input id="age-at" type="date" />
        <button type="button" data-today="age-at">今日</button>
      </div>
      <p id="age-result" class="result"></p>
    </section>

    <section>
      <h2>元号の一覧</h2>
      <table id="era-table">
        <thead>
          <tr>
            <th>元号</th>
            <th>開始日</th>
            <th>西暦 = 和暦 + </th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </div>

  <script type="module">
    const $ = (id) => document.getElementById(id);

    /** 元号(開始日の新しい順)。明治5年までの旧暦期間も新暦の日付で扱う */
    const ERAS = [
      { name: "令和", short: "R", start: [2019, 5, 1] },
      { name: "平成", short: "H", start: [1989, 1, 8] },
      { name: "昭和", short: "S", start: [1926, 12, 25] },
      { name: "大正", short: "T", start: [1912, 7, 30] },
      { name: "明治", short: "M", start: [1868, 10, 23] },
    ];
    const WEEKDAYS = "日月火水木金土";
    const ZODIAC = "子丑寅卯辰巳午未申酉戌亥";
    const ZODIAC_ANIMALS = ["ねずみ", "うし", "とら", "うさぎ", "たつ", "へび", "うま", "ひつじ", "さる", "とり", "いぬ", "いのしし"];

    // 日付はすべてローカル時刻の 0:00 で扱う(時差・夏時間で1日ずれないよう日数計算は UTC に変換して行う)
    const parseDate = (value) => {
      if (!value) return null;
      const [y, m, d] = value.split("-").map(Number);
      const date = new Date(y, m - 1, d);
      return Number.isNaN(date.getTime()) ? null : date;
    };
    const toInputValue = (date) => date.toLocaleDateString("sv-SE");
    const toUtcDays = (date) => Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()) / 86400000;
    const eraStartDate = (era) => new Date(era.start[0], era.start[1] - 1, era.start[2]);

    const toWareki = (date) => {
      const era = ERAS.find((e) => date >= eraStartDate(e));
      if (!era) return null;
      const year = date.getFullYear() - era.start[0] + 1;
      return { era, year, label: `${era.name}${year === 1 ? "元" : year}年` };
    };

    const formatDate = (date) => {
      const wareki = toWareki(date);
      const md = `${date.getMonth() + 1}月${date.getDate()}日(${WEEKDAYS[date.getDay()]})`;
      return `${date.getFullYear()}年${md}` + (wareki ? ` / ${wareki.label}${md}` : "");
    };

    const setResult = (id, main, sub = "") => {
      const elem = $(id);
      elem.textContent = main;
      if (sub) {
        const span = document.createElement("span");
        span.className = "muted";
        span.textContent = `\n${sub}`;
        elem.appendChild(span);
      }
    };

    // ---------------------------------------------------------------- 西暦 → 和暦
    const renderToWareki = () => {
      const date = parseDate($("to-wareki-date").value);
      if (!date) return setResult("to-wareki-result", "");
      const wareki = toWareki(date);
      const year = date.getFullYear();
      const zodiacIndex = (((year - 4) % 12) + 12) % 12;
      setResult(
        "to-wareki-result",
        wareki ? `${wareki.label}${date.getMonth() + 1}月${date.getDate()}日(${wareki.era.short}${wareki.year}.${date.getMonth() + 1}.${date.getDate()})` : "明治より前の日付です",
        `${WEEKDAYS[date.getDay()]}曜日 / 干支: ${ZODIAC[zodiacIndex]}(${ZODIAC_ANIMALS[zodiacIndex]})年`
      );
    };

    // ---------------------------------------------------------------- 和暦 → 西暦
    const renderToSeireki = () => {
      const era = ERAS.find((e) => e.name === $("era").value);
      const year = Number($("era-year").value);
      if (!era || !Number.isInteger(year) || year < 1) return setResult("to-seireki-result", "年を正しく入力してください");
      const seireki = era.start[0] + year - 1;
      const next = ERAS[ERAS.indexOf(era) - 1];
      const notes = [];
      if (year === 1) notes.push(`${era.name}は ${era.start[0]}年${era.start[1]}月${era.start[2]}日から`);
      if (next && seireki > next.start[0]) notes.push(`※${era.name}${year}年は実在しません(${next.start[0]}年に${next.name}へ改元)`);
      else if (next && seireki === next.start[0]) notes.push(`${next.start[1]}月${next.start[2]}日から${next.name}元年`);
      setResult("to-seireki-result", `${seireki}年`, notes.join(" / "));
    };

    // ---------------------------------------------------------------- ○日後
    const renderAdd = () => {
      const base = parseDate($("add-base").value);
      const amount = Number($("add-days").value);
      if (!base || !Number.isInteger(amount)) return setResult("add-result", "");
      const unit = $("add-unit").value;
      const result = new Date(base);
      let note = "";
      if (unit === "day" && $("add-skip-weekend").checked) {
        const step = Math.sign(amount);
        let remaining = Math.abs(amount);
        while (remaining > 0) {
          result.setDate(result.getDate() + step);
          if (result.getDay() !== 0 && result.getDay() !== 6) remaining--;
        }
        note = `土日を除いて${Math.abs(amount)}日(カレンダー上は${Math.abs(toUtcDays(result) - toUtcDays(base))}日)`;
      } else if (unit === "day" || unit === "week") {
        result.setDate(result.getDate() + amount * (unit === "week" ? 7 : 1));
      } else {
        // 月末をまたぐ場合(1/31 の1か月後など)は、その月の末日にそろえる
        const months = amount * (unit === "year" ? 12 : 1);
        const day = base.getDate();
        result.setDate(1);
        result.setMonth(result.getMonth() + months);
        const lastDay = new Date(result.getFullYear(), result.getMonth() + 1, 0).getDate();
        result.setDate(Math.min(day, lastDay));
        if (day > lastDay) note = `${day}日が無い月のため末日にしています`;
      }
      setResult("add-result", formatDate(result), note);
    };

    // ---------------------------------------------------------------- 日付の差
    const renderDiff = () => {
      const from = parseDate($("diff-from").value);
      const to = parseDate($("diff-to").value);
      if (!from || !to) return setResult("diff-result", "");
      const inclusive = $("diff-inclusive").checked;
      const sign = to >= from ? 1 : -1;
      const [start, end] = sign > 0 ? [from, to] : [to, from];
      const days = toUtcDays(end) - toUtcDays(start) + (inclusive ? 1 : 0);

      // ○年○か月○日 の内訳
      let months = (end.getFullYear() - start.getFullYear()) * 12 + (end.getMonth() - start.getMonth());
      if (end.getDate() < start.getDate()) months--;
      const anchor = new Date(start.getFullYear(), start.getMonth() + months, 1);
      anchor.setDate(Math.min(start.getDate(), new Date(anchor.getFullYear(), anchor.getMonth() + 1, 0).getDate()));
      const restDays = toUtcDays(end) - toUtcDays(anchor) + (inclusive ? 1 : 0);
      const breakdown = [
        Math.floor(months / 12) && `${Math.floor(months / 12)}年`,
        months % 12 && `${months % 12}か月`,
        `${restDays}日`,
      ].filter(Boolean).join("");

      // 平日数: 当日を含まない場合は開始日の翌日から数える
      let weekdays = 0;
      const first = new Date(start);
      if (!inclusive) first.setDate(first.getDate() + 1);
      for (let i = 0; i < days; i++) {
        const day = new Date(first.getFullYear(), first.getMonth(), first.getDate() + i).getDay();
        if (day !== 0 && day !== 6) weekdays++;
      }

      setResult(
        "diff-result",
        `${sign < 0 ? "-" : ""}${days.toLocaleString("ja-JP")}日`,
        `${breakdown} / ${Math.floor(days / 7)}週${days % 7}日 / 平日(月〜金)${weekdays.toLocaleString("ja-JP")}日` +
          (sign < 0 ? " / 終了日が開始日より前です" : "")
      );
    };

    // ---------------------------------------------------------------- 年齢
    const renderAge = () => {
      const birth = parseDate($("birth").value);
      const at = parseDate($("age-at").value);
      if (!birth || !at) return setResult("age-result", "");
      if (at < birth) return setResult("age-result", "生年月日より前の日付です");
      let age = at.getFullYear() - birth.getFullYear();
      const hadBirthday = at.getMonth() > birth.getMonth() || (at.getMonth() === birth.getMonth() && at.getDate() >= birth.getDate());
      if (!hadBirthday) age--;
      const nextBirthday = new Date(at.getFullYear() + (hadBirthday ? 1 : 0), birth.getMonth(), birth.getDate());
      const untilNext = toUtcDays(nextBirthday) - toUtcDays(at);
      const wareki = toWareki(birth);
      setResult(
        "age-result",
        `${age}歳`,
        `${wareki ? `${wareki.label}生まれ / ` : ""}生まれてから${(toUtcDays(at) - toUtcDays(birth)).toLocaleString("ja-JP")}日 / 次の誕生日まで${untilNext}日`
      );
    };

    // ---------------------------------------------------------------- 初期化
    ERAS.forEach((era) => {
      const option = document.createElement("option");
      option.value = option.textContent = era.name;
      $("era").appendChild(option);
      const row = $("era-table").tBodies[0].insertRow(-1);
      row.insertCell(-1).textContent = `${era.name}(${era.short})`;
      row.insertCell(-1).textContent = `${era.start[0]}年${era.start[1]}月${era.start[2]}日`;
      row.insertCell(-1).textContent = String(era.start[0] - 1);
    });

    const today = toInputValue(new Date());
    ["to-wareki-date", "add-base", "diff-to", "age-at"].forEach((id) => ($(id).value = today));
    $("diff-from").value = `${new Date().getFullYear()}-01-01`;
    $("era-year").value = String(toWareki(new Date()).year);

    const renderAll = () => {
      renderToWareki();
      renderToSeireki();
      renderAdd();
      renderDiff();
      renderAge();
    };
    document.querySelectorAll("input, select").forEach((elem) => elem.addEventListener("input", renderAll));
    document.querySelectorAll("[data-today]").forEach((button) =>
      button.addEventListener("click", () => {
        $(button.dataset.today).value = toInputValue(new Date());
        renderAll();
      })
    );
    renderAll();
  </script>
</body>

</html>
