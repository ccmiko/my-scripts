<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>画像から文字起こし隊</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#2f9e44" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <!-- テーマ(ダークモード)をちらつかせず適用するため、head で同期的に読み込む -->
    <script src="./common.js"></script>
    <!-- CDN から import する ES Module の改ざんチェック(SRI)。対応ブラウザでは、ハッシュが一致しないと読み込まない -->
    <script type="importmap">
      {
        "integrity": {
          "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.esm.min.js": "sha384-QQzZA46xA/VjjQvj6owZDvSOm5wwh/sb9wG3cf1XT2fC/4FT9H9BEhCur31NYnos"
        }
      }
    </script>
    <link rel="stylesheet" href="./app.css" />
    <style>
      .drop {
        display: block;
        border: 2px dashed var(--border);
        border-radius: 12px;
        padding: 24px 16px;
        text-align: center;
        font-size: 18px;
        cursor: pointer;
        margin: 0 0 12px;
      }

      .drop:hover,
      body.dragging .drop {
        border-color: var(--accent);
      }

      .lang-container {
        font-size: 14px;
      }

      .lang-container label {
        display: inline;
        margin-left: 8px;
        white-space: nowrap;
      }

      #status-container ul {
        margin: 0;
        padding-left: 1.2em;
        font-size: 14px;
      }

      #show-ocr-result-container h2 {
        margin-top: 16px;
        word-break: break-all;
      }

      #show-ocr-result-container img {
        margin: 8px 0;
        border-radius: 6px;
        max-width: 100% !important;
      }

      /* まだ中身がない枠は表示しない */
      section:has(> #status-container:empty),
      section:has(> #show-ocr-result-container:empty) {
        display: none;
      }
    </style>
  </head>

  <body>
    <div class="wrapper">
      <h1>画像から文字起こし隊</h1>
      <section>
        <label id="uploader-label" class="drop" for="uploader">
          <span id="uploader-elem">ここをクリックして画像を選ぶ</span>
          <span class="muted" style="display: block">Ctrl/⌘+V で貼り付け、またはドラッグ＆ドロップでもOK</span>
        </label>
        <input type="file" id="uploader" accept="image/*" multiple hidden />
        <div id="lang-container" class="lang-container">
          <!-- jsで言語の選択肢を挿入 -->
        </div>
      </section>
      <section>
        <div id="status-container"></div>
      </section>
      <section>
        <div id="show-ocr-result-container"></div>
      </section>
    </div>

    <script type="module">
      // API仕様 → https://github.com/naptha/tesseract.js/blob/master/docs/api.md
      import tesseractJs from "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.esm.min.js";
      /** 選べる言語(code は tesseract の言語コード)。選んだ分だけ言語データを読み込む */
      const LANGUAGES = [
        { code: "jpn", label: "日本語", defaultOn: true },
        { code: "eng", label: "英語", defaultOn: true },
        { code: "chi_tra", label: "中国語(繁体)", defaultOn: false },
        { code: "chi_sim", label: "中国語(簡体)", defaultOn: false },
        { code: "kor", label: "韓国語", defaultOn: false },
      ];
      const LANG_STORAGE_KEY = "OCR_LANGUAGES";

      const loadSelectedLangs = () => {
        try {
          const saved = JSON.parse(window.localStorage.getItem(LANG_STORAGE_KEY));
          const valid = Array.isArray(saved)
            ? saved.filter((code) => LANGUAGES.some((lang) => lang.code === code))
            : [];
          if (valid.length) return valid;
        } catch (error) {
          console.error(error);
        }
        return LANGUAGES.filter((lang) => lang.defaultOn).map((lang) => lang.code);
      };

      const getSelectedLangs = () =>
        [...document.querySelectorAll("#lang-container input:checked")].map((input) => input.value);

      /** 言語の組み合わせごとにワーカーを作り直す(同じ組み合わせなら使い回す) */
      let currentWorker = { key: null, promise: null };
      const getWorker = (langs) => {
        const key = langs.join("+");
        if (currentWorker.key !== key) {
          const previous = currentWorker.promise;
          previous?.then((worker) => worker.terminate()).catch(() => {});
          // 引数をいじったらワンチャン文字起こし精度改善の可能性あり
          currentWorker = { key, promise: tesseractJs.createWorker(langs) };
          // 失敗したら次回作り直す
          currentWorker.promise.catch(() => {
            if (currentWorker.key === key) currentWorker = { key: null, promise: null };
          });
        }
        return currentWorker.promise;
      };

      const addCopyBtnElem = (lines, targetElem) => {
        const btnElem = document.createElement("button");
        btnElem.style.display = "inline";
        btnElem.style.marginRight = "10px";
        btnElem.textContent = "コピーする";
        btnElem.addEventListener("click", () => {
          const txt = lines.map((line) => line.text).join("\n");
          window.MiniApps.copyText(txt);
        });
        targetElem.appendChild(btnElem);
      };

      const addCopyBtnWithoutBlankElem = (lines, targetElem) => {
        const btnElem = document.createElement("button");
        btnElem.style.display = "inline";
        btnElem.textContent = "コピーする(空白削除)";
        btnElem.addEventListener("click", () => {
          const txt = lines.map((line) => line.text.replace(/\s+/g, "")).join("\n");
          window.MiniApps.copyText(txt);
        });
        targetElem.appendChild(btnElem);
      };

      const showOcrResult = (file, lines) => {
        const resultElem = document.getElementById("show-ocr-result-container");

        const h2Elem = document.createElement("h2");
        h2Elem.textContent = `ファイル名: ${file.name}`;
        resultElem.appendChild(h2Elem);
        addCopyBtnElem(lines, resultElem);
        addCopyBtnWithoutBlankElem(lines, resultElem);

        const image = document.createElement("img");
        image.style.display = "block";
        image.src = URL.createObjectURL(file);
        image.alt = image.title = file.name;
        // 縦横比を保ったまま縮小表示する
        image.style.maxWidth = "500px";
        image.style.maxHeight = "300px";
        image.onload = () => URL.revokeObjectURL(image.src);
        resultElem.appendChild(image);

        const ulElem = document.createElement("ul");
        lines.forEach((line) => {
          const liElem = document.createElement("li");
          liElem.textContent = line.text;
          ulElem.appendChild(liElem);
        });
        resultElem.appendChild(ulElem);
      };

      let busy = false;

      const recognizeFiles = function (files) {
        files = files.filter((file) => file.type.startsWith("image/"));
        if (!files.length || busy) {
          return;
        }
        const langs = getSelectedLangs();
        if (!langs.length) {
          window.MiniApps.showSnackBar("言語を1つ以上選んでください", 2000);
          return;
        }
        busy = true;
        const uploaderElem = document.getElementById("uploader");
        uploaderElem.disabled = true;
        const resultElem = document.getElementById("show-ocr-result-container");
        resultElem.textContent = "";
        const statusElem = document.getElementById("status-container");
        statusElem.textContent = "";
        const ulElem = document.createElement("ul");
        statusElem.appendChild(ulElem);

        const createMsgWithTs = (msg) => {
          const now = new Date();
          return `【${now.toDateString()} ${now.toTimeString().slice(0, 8)}.${String(now.getMilliseconds()).padStart(3, "0")}】${msg}`;
        };

        const addLiElem = (id, msg) => {
          const liElem = document.createElement("li");
          liElem.textContent = msg;
          liElem.id = id;
          ulElem.appendChild(liElem);
        };

        const langLabels = langs.map((code) => LANGUAGES.find((lang) => lang.code === code).label).join("・");
        addLiElem("loading-worker", createMsgWithTs(`OCRエンジンを準備中...(${langLabels})`));
        getWorker(langs)
          .then((worker) => {
            addLiElem("loaded-worker", createMsgWithTs("OCRエンジンの準備完了"));
            return Promise.allSettled(
              files.map((file, index) => {
                // 無料だが、あまり精度が良くない
                // 第2引数~をいじったらワンチャン文字起こし精度改善の可能性あり
                addLiElem(`analyze-${index}`, createMsgWithTs(`解析中ファイル: ${file.name}`));
                return worker
                  .recognize(file, { rotateAuto: true }, { imageColor: true, imageGrey: true, imageBinary: true })
                  .then((result) => {
                    addLiElem(`analyze-completed-${index}`, createMsgWithTs(`解析完了したファイル: ${file.name}`));
                    showOcrResult(file, result.data.lines);
                  })
                  .catch((error) => {
                    console.error(error);
                    addLiElem(
                      `analyze-failed-${index}`,
                      createMsgWithTs(`解析に失敗したファイル: ${file.name} (${error?.message ?? error})`),
                    );
                  });
              }),
            );
          })
          .then(() => {
            addLiElem(`analyze-completed-all`, createMsgWithTs(`全ての画像解析が完了`));
          })
          .catch((error) => {
            console.error(error);
            addLiElem(
              "loading-worker-failed",
              createMsgWithTs(`OCRエンジンの準備に失敗しました (${error?.message ?? error})`),
            );
          })
          .finally(() => {
            busy = false;
            uploaderElem.disabled = false;
            // 同じファイルを選び直しても change イベントが発火するようにする
            uploaderElem.value = "";
          });
      };

      const initLanguages = () => {
        const container = document.getElementById("lang-container");
        const selected = loadSelectedLangs();
        container.append("言語:");
        LANGUAGES.forEach(({ code, label }) => {
          const labelElem = document.createElement("label");
          const input = document.createElement("input");
          input.type = "checkbox";
          input.value = code;
          input.checked = selected.includes(code);
          input.addEventListener("change", () => {
            window.localStorage.setItem(LANG_STORAGE_KEY, JSON.stringify(getSelectedLangs()));
          });
          labelElem.append(input, label);
          container.appendChild(labelElem);
        });
      };

      const init = () => {
        initLanguages();
        document
          .getElementById("uploader")
          .addEventListener("change", (e) => recognizeFiles(Array.from(e.target.files)));

        // クリップボードの画像を貼り付けて解析する(スクリーンショットをそのまま貼れる)
        document.addEventListener("paste", (e) => {
          const files = Array.from(e.clipboardData?.files ?? []);
          if (files.length) {
            e.preventDefault();
            recognizeFiles(files);
          }
        });

        // ドラッグ＆ドロップ
        let dragDepth = 0;
        document.addEventListener("dragenter", (e) => {
          if (!e.dataTransfer?.types.includes("Files")) return;
          dragDepth++;
          document.body.classList.add("dragging");
        });
        document.addEventListener("dragleave", () => {
          dragDepth = Math.max(0, dragDepth - 1);
          if (dragDepth === 0) document.body.classList.remove("dragging");
        });
        document.addEventListener("dragover", (e) => e.preventDefault());
        document.addEventListener("drop", (e) => {
          e.preventDefault();
          dragDepth = 0;
          document.body.classList.remove("dragging");
          recognizeFiles(Array.from(e.dataTransfer?.files ?? []));
        });
      };

      init();
    </script>
  </body>
</html>
