server {
    listen       80;
    server_name localhost;
    root   /var/www;

    location / {
        index  index.html index.htm;
        # 存在しないファイルは 404 にする(index.html を返すと account.enc.json 等の有無を判定できない)
        try_files $uri $uri/ =404;
    }

    # Service Worker は更新をすぐ反映させるため、ブラウザにキャッシュさせない
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # PWA の manifest(nginx 標準の mime.types に無いため指定する)
    location ~ \.webmanifest$ {
        types { application/manifest+json webmanifest; }
        try_files $uri =404;
    }

    # アカウント情報はブラウザ・Service Worker にキャッシュさせない
    location ~ ^/account(\.enc)?\.json$ {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
