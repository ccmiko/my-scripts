server {
    listen       80;
    server_name localhost;

    location / {
        root   /var/www;
        index  index.html index.htm;
        # 存在しないファイルは 404 にする(index.html を返すと account.enc.json 等の有無を判定できない)
        try_files $uri $uri/ =404;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
