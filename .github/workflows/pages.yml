name: pages

# htmls/ を GitHub Pages に公開する。PR ではビルドと確認だけ行い、デプロイは main への push 時のみ。
on:
  push:
    branches: [main]
    paths:
      - "htmls/**"
      - "scripts/build-pages.js"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "htmls/**"
      - "scripts/build-pages.js"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# デプロイが重なった場合は新しい方だけを残す
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 改ざん対策として、利用する action はコミット SHA で固定する(コメントは対応するバージョン)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 公開用ファイルを作成(アカウント一覧は除外)
        run: node scripts/build-pages.js _site
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
